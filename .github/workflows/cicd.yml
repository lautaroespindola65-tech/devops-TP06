deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy con Docker Compose
        run: |
          cd /opt/devops-portfolio
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          echo "Deploy completado: $(date)"

      - name: Healthcheck post-deploy
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            http://localhost/health || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Deploy exitoso — HTTP $STATUS"
          else
            echo "Deploy falló — HTTP $STATUS"
            exit 1
          fi
